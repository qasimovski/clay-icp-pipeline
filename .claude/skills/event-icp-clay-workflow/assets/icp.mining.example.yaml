# EXAMPLE: the real Mining V2 icp.yaml (config/icps/mining/icp.yaml, Oct 2026). Compared with
# icp.example.yaml (Highways) it shows: per-side exclusions, exact_titles, three seniority groups
# (A / B1 / B2), Clay country spellings, and comments recording each decision. Every value is a variable.
#
# Mining ICP: The Mining Show (Dubai, 16-17 Nov 2026; then 16-17 Oct 2027).
# Read by .claude/skills/event-icp-clay-workflow/scripts/icp_mapping.py (the people workflow's
# ICP Mapping node). Source: "Mining Playbook ICP.xlsx", V2 tabs only (V2 always beats V1):
#   Seller JTs v2, BuySide ICP v2, Geo_Scope v2.
# Rules the Clay search can't express (exact match, per-keyword exclusions, persona, geo tier,
# the Germany split) are in post_filter.yaml beside this file and are applied to the results.
#
# Decisions behind this file (user, 25 Oct 2026):
# - Person location only. The countries below filter where the PERSON is, not the company HQ.
# - Sell side: Bookers and Stand staff in ONE contain search (the lists share 25 keywords, so
#   two searches would pay twice for the same people); post_filter.yaml tags the persona.
# - Exact titles that are safe in contain mode (CEO, Managing Director...) are in `titles`;
#   their extra hits ("CEO & Founder") are judged by post_filter.yaml. Exact titles that
#   contain mode would flood ("Vice President" hits every VP; bare Manager / Director / Sales)
#   are in `exact_titles`, searched only by a separate exact-mode pass if approved after the
#   draft test.
# - Germany is searched (sell side) but never emailed: post_filter.yaml sends it to a
#   LinkedIn-only file. Parked countries (Sudan, Iran, Russia, Belarus) are not searched.
#
# Seniority, both tabs: "All except Intern/Trainee, Assistant, Entry, Freelance"
# -> every Clay slug except entry and intern, plus the title exclusions below.
# Short brand for the final Salesforce CSV names (Competitive_<Brand>.csv, Buy_side_<Brand>.csv ...;
# user, 2026-11-07; .claude/skills/event-icp-clay-workflow/scripts/sf_naming.py). Letters and digits only.
salesforce_brand: Mining
seniority:
- founder
- owner
- board-member
- partner
- c-suite
- vp
- director
- head
- manager
- senior
- mid-level
seniority_groups:
  A:
  - founder
  - owner
  - board-member
  - partner
  - c-suite
  - vp
  - director
  # B1 + B2 replaced B (head..mid-level) on 25 Oct 2026, after B came back full (10) at 724 of
  # 804 split companies. The first run's B searches are kept and merged with B1 + B2.
  B1:
  - head
  - manager
  B2:
  - senior
  - mid-level

# Both sides. Kept short on purpose: collect.py also applies this list at export to every
# person, and the buy side's EXCLUDE row (Sales Manager, Marketing...) must not touch sellers.
exclude_titles:
- Intern
- Trainee
- Assistant
- Freelance

sell:
  # Clay-side exclusions only where no sell keyword ever wants the word. The Marketing-only
  # exclusions (Digital, Performance, Content, Email, Growth) and the Bookers' "Aftersales"
  # (wanted by Stand staff) are applied per keyword in post_filter.yaml instead.
  exclude_titles:
  - Presales
  - Pre-Sales
  - SEO
  - Social Media
  - Influencer
  - Affiliate
  - Brand Ambassador
  titles:
  # Exact on the sheet, safe in contain mode
  - CEO
  - Chief Executive Officer
  - MD
  - Managing Director
  - General Manager
