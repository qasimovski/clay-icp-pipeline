  - Account Manager
  - Account Executive
  - Application Engineer
  - Service Engineer
  - Product Manager
  - Project Manager
  - Export
  - Aftersales
  - Sales Support
  - Service Manager
  - Sales Area
  # Spelling variants. Clay matches whole words; the sheet's notes assume substring hits
  # ("Export hits Exporter"; "Communication" excludes "Telecommunication").
  - Exporter
  - Communications
  # Exact-mode pass only (see header). Bare Manager / Director / Sales: "run only on companies
  # that pass Products_Services v2" (Nic, 23 Oct); every company in this feed does.
  exact_titles:
  - President
  - Vice President
  - Manager
  - Director
  - Sales
  # Geo_Scope v2 SELL SIDE: Core, Yes, Secondary and Exhibitor sourcing (Germany). Blank and
  # Parked are left out. One list for every category: the sheet doesn't vary it by category.
