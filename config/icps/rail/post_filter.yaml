  near_exact: true
  non_english: true
  bare_titles: [Manager, Director, Sales, President, Vice President, Owner, Engineer, Senior Engineer, Project Engineer,
                Partner, Senior Manager, Project Manager, Operations Manager, Product Manager, Area Manager,
                Technical Manager, Associate Director, Deputy Director]

