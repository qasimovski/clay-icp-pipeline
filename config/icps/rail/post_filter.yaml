# Kept-with-a-flag rules (people_rules.md). Near-exact = an exact title + a qualifier ('Group CEO'). Generic
# job-family exact titles never count as near-exact: the sheet says 'Contains Engineer also hits ... unrelated
# engineers' (r81), and 'IT Project Manager' / 'HR Business Partner' are not bookers. Skill defaults first.
