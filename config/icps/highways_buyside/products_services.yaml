  # every keyword names a highways discipline.
  - name: Sub-engineering contractors
    industry:
      - Specialty Trade Contractors
      - Highway, Street, and Bridge Construction
      - Civil Engineering
      - Construction
      - Building Structure and Exterior Contractors
      - Building Equipment Contractors
      - Building Finishing Contractors
      - Utility System Construction
      - Engineering Services
    description:
      - highway surfacing contractor
      - surfacing contractor
      - road surfacing
      - traffic signals contractor
      - ITS provider
      - street lighting contractor
      - road markings contractor
      - road marking
      - safety barriers
      - vehicle restraint
      - drainage contractor
      - structures repair
      - bridge repair
      - specialist highways contractor
      - highways subcontractor
      - civils subcontractor
      - kerbing
      - fencing contractor
    products_and_services:
      - specialist highways subcontracting packages
      - road surfacing and markings contracting
      - highways structures and drainage repair

  # ---------------------------------------------------------------------
