  # ---------------------------------------------------------------------
  # INFERRED CATEGORY — read the note before changing it.
  #
  # The sheet's `Finance, Investment, Legal` row (242) gives EIGHT JOB TITLES
  # and nothing else: no descriptive text, no search keywords, no example
  # organisations and — uniquely on this sheet — NO COUNTRIES. There is not
  # enough there to draft a company query directly, and the literal reading
  # ("every investment manager and law firm in five countries") would be a
  # six-figure list of companies with no connection to roads.
  #
  # So this entry is my inference, not the sheet's: the finance and legal
  # organisations that fund, invest in and advise on ROAD infrastructure —
  # infrastructure funds, PPP investors, project-finance banks and the
  # transactional advisers around them. Countries default to the ICP's five.
  # Anchored, because without it the industry enums are the entire financial
  # sector.
  - name: Finance, Investment, Legal
    anchor: roads
    industry:
      - Investment Management
      - Venture Capital and Private Equity Principals
      - Investment Banking
      - Investment Advice
      - Banking
      - Financial Services
      - Capital Markets
      - Law Practice
      - Legal Services
      - Business Consulting and Services
      - Funds and Trusts
    description:
      - infrastructure fund
      - infrastructure investment
      - infrastructure investor
      - project finance
      - public private partnership
      - PPP
      - concession finance
      - transport infrastructure investment
      - infrastructure debt
      - construction law
      - infrastructure legal
      - procurement law
      - transaction advisory
      - infrastructure advisory
      - asset finance
    products_and_services:
      - infrastructure investment and project finance
      - public private partnership advisory
      - construction and infrastructure legal services
