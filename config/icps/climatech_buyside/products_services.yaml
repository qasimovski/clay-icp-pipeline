# DRAFT 2026-11-15. ClimaTech BUY SIDE company searches, from the "BuySide ICP v2" tab.
#
# Source: scrapers_climatech/ClimaTech Playbook ICP.xlsx, tab "BuySide ICP v2" (9 buyer groups,
# 13 sub-segments, cross-cutting titles, "Government by geo", investors note) and tab
# "Geo_Scope v2" (BUY columns). V2 always wins (memory: icp-version-precedence).
#
# Route (user, 2026-11-15): the Solar / EVCharge buy-side route, with two sources for companies:
#   Clay company search from the CLI (clay_company_search.py, this file via ps_query_config.py)
#   AND Blitz company search (scrapers_climatech/_buyside/search/blitz_company_search.py, which
#   reads this same file) for every sub-segment x country -> union, dedupe by domain
#   (merge_company_search.py) -> Supabase companies gate -> Find People (Clay) + Blitz ->
#   Deepline people search where coverage is thin for a country.
#
# Decisions (user, 2026-11-15):
#   - Countries: the 5 event countries only (Geo_Scope v2: "BUY SIDE = local market only"):
#     Climatech KSA = Saudi Arabia, London = UK, Paris = France, Italy = Italy,
#     HVACTech Live Vietnam = Vietnam. Neighbouring countries are sell-side sourcing only.
#   - Include "Government by geo" and "Investors and financiers" on top of the 9 groups.
#   - Dedupe companies AND people against ClimaTech Competitive Events (_run_v2) and ClimaTech
#     Other Sources (_other_sources) before any paid search.
#   - Germany is not a buy country, so the LinkedIn-only rule does not arise here.
#
# Per-sub-segment countries come from the sheet:
#   Giga-project & master developers -> Saudi Arabia only ("(KSA)"; "Climatech KSA core").
#   Commercial & residential developers -> UK, France, Italy, Vietnam ("(UK, FR, IT, VN)").
#   Heat pump & HVAC installers -> UK, France, Italy ("mainly London/Paris/Italy visitor audience").
#   Social housing -> UK, France, Italy (note "London and Paris"; the examples also name ACER, Italy).
#     User 2026-11-15 ("go with your suggestions"): Italy stays in.
#   Government by geo -> one search per country, with that country's bodies.
#   Everything else -> all 5.
#
# Precision, not caps (Solar rule): the sheet's industries, "Extra keyword filter (company)",
# example organisations and notes are spread across industry / description / description_not /
# anchors. Broad sectors (real estate, hospitality, hospitals, transport, manufacturing,
# telecoms) also carry the persona filter (people_titles: a current employee with the buyer
# persona, located in a buy country), and a "(1,000+ staff)" companion without the persona so big
# real targets whose staff Clay has not typed are not lost (Solar 2026-11-06). The persona list on
# a company search is the sheet's segment titles with the generic words left out (Director,
# Manager, Operations: every company has them) plus local-language forms (French/Italian titles
# from the cross-cutting list). The full persona is applied at the people search, not here.
#
# Local-language keywords (fonciere, bailleur social, teleriscaldamento...) are kept because
# French / Italian / Vietnamese companies often describe themselves in their own language;
# `contains` matches whole words, so both accented and unaccented spellings are listed.
#
# Industry names the sheet uses that are not Clay enum values were mapped:
#   Hospital & Health Care -> Hospitals and Health Care, Hospitals
#   Leisure -> Leisure, Travel & Tourism, Recreational Facilities, Entertainment Providers
#   Airlines/Aviation; Transportation -> Airlines and Aviation, Rail Transportation, Urban Transit
#     Services, Transportation/Trucking/Railroad, Maritime Transportation
#   Information Technology & Services -> Information Technology and Services, IT Services and IT
#     Consulting, Data Infrastructure and Analytics, IT System Data Services
#   Oil & Energy -> Oil and Gas, Utilities, Steam and Air-Conditioning Supply (district energy)
#   Non-profit -> Non-profit Organizations, Housing and Community Development, Housing Programs
#
# Additions not on the sheet, marked ADDED below, for the user's approval:
#   - "Energy service companies (ESCOs)" in group 3: the sheet's Boundary note says ESCOs are
#     buy side, but no sub-segment lists them.

# Company office countries, in Clay's COMPANY enum.
countries:
  - Saudi Arabia
  - United Kingdom
  - France
  - Italy
  - Vietnam

# The same 5 in Clay's PEOPLE enum (identical spellings for these five).
person_countries:
  - Saudi Arabia
  - United Kingdom
  - France
  - Italy
  - Vietnam

persona_companion:
  suffix: (1,000+ staff)
  company_size:
    - 1,001-5,000
    - 5,001-10,000
    - 10,001+

# The sheet has no tier column; Tier is left blank and "Priority" carries the sheet's
# "Priority (proposed)" value.
tiers: {}

anchors:
  # REITs / asset managers: Investment Management alone is every fund manager, so the company
  # must also talk about property.
  real_estate:
    - real estate
    - property
    - properties
    - immobilier
    - immobiliere
    - immobilière
    - immobiliare
  # Heat pump installers: the company must talk about heat pumps (sample 2026-11-15: bare
  # installateur / RGE let in window makers, fire-alarm and solar installers).
  heat_pump:
    - heat pump
    - heat pumps
    - air source
    - ground source
    - pompe a chaleur
    - pompe à chaleur
    - pompes a chaleur
    - pompes à chaleur
    - pompa di calore
    - pompe di calore
    - HVAC
    - air conditioning
    - climatisation
    - climatizzazione
  # MEP consultants: bare "engineering consultancy" let in automotive, marine, tunnelling and
  # geospatial firms (sample 2026-11-15), so the company must also talk about buildings / MEP.
  buildings:
    - building
    - buildings
    - MEP
    - HVAC
    - M&E
    - mechanical and electrical
    - batiment
    - bâtiment
    - batiments
    - bâtiments
    - edilizia
    - impianti
    - architecture
    - architectural
  # Investors: only those funding HVAC / district energy / efficiency assets (sheet note).
  energy_assets:
    - district cooling
    - district heating
    - district energy
    - heat network
    - heat networks
    - energy efficiency
    - energy infrastructure
    - energy transition
    - decarbonisation
    - decarbonization
    - ESCO
    - energy services

