# DRAFT 2026-11-15. ClimaTech BUY SIDE people search (Find People + Blitz), from the "BuySide ICP v2" tab of
# scrapers_climatech/"ClimaTech Playbook ICP.xlsx". GENERATED from config/icps/climatech/icp.yaml (APPROVED by
# the user 9 Nov 2026 for ClimaTech CE) by a one-off script, so the 9 buyer-group categories are byte-identical
# to the approved CE buy side: same titles, exclusions, exact titles, seniority, 5 countries.
#
# Classification in the people feed = the buyer group of products_services.yaml beside this file, without its
# number ("1. Developers & giga-projects" -> "Developers & giga-projects"). The ADDED ESCO search (group 3)
# therefore uses the Facilities management companies titles.
#
# Two categories added for the buy side (user 2026-11-15: include Government by geo and Investors):
#   Government: the sheet's GOVERNMENT BY GEO title lists for all 5 countries (each person is searched only in
#     the company's own country via Countries Override, so the union is harmless) + the cross-cutting
#     "Sustainability & energy" and "Property & estates" titles. Director General is Exact (post_filter).
#     Senior decision-makers and Procurement are left out (my call, as EVCharge's Government: a council CEO
#     is not the HVAC buyer). User 2026-11-15 ("go with your suggestions"): left out.
#
# Also decided 2026-11-15 (user: "go with your suggestions"):
#   - Cap 20 people per company (Solar buy-side precedent; merge_people.py --cap 20).
#   - Audiences step = the ClimaTech Other Sources rule (user 2026-11-13): match against ALL of Clay
#     Audiences; a matched person STAYS, takes the audience record's fields, and is NOT sent to email
#     enrichment (scrapers_climatech/_other_sources/people/os_audience_match.py).
#   Investors & financiers: the sheet's investor note titles (Investment Director; Head of Infrastructure;
#     Energy Transition) + Senior decision-makers + Sustainability & energy.
#
# Countries: buy.default_countries = the 5 event countries. Per-sub-segment limits from the sheet (Giga KSA
# only; Commercial developers UK/FR/IT/VN; Heat pump installers and Social housing UK/FR/IT; Government by its
# own country) go in the feed's Countries Override column (build_feed.py), not here.
# `sell` is empty: this ICP config is buy side only (the sell side is config/icps/climatech/).

