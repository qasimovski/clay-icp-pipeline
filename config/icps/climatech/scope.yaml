# APPROVED by the user, 9 Nov 2026 ("yes"). Source: ClimaTech Playbook ICP.xlsx V2 tabs, each read in full.
# ClimaTech ICP: which classified competitor-event companies are in scope per event.
# Source: "ClimaTech Playbook ICP.xlsx" Competitor v2 (75 rows, read in full): 52 "In scope" events,
# 12 Parked, 11 Cut. Parked and Cut events are simply not listed. Companies were classified fresh by
# the Claygent (scrapers_climatech/_run_v2/classified_all.csv), so there is no earlier-run type_map here.
# DECISIONS.md (9 Nov 2026, item 7): per-event "screen to ..." notes (col J) are applied AFTER
# classification, as the per-event rules below.
#
# Reading of col J (user, 9 Nov 2026: "Apply Tier 3 notes"):
# - Tier 1 and Tier 2: keep every V2 label. Their notes say "screen to HVAC / heat pump / BMS ...",
#   which the classification already did (anything else is Out of ICP). The four Tier 2 events whose
#   notes name a narrower list (Batimat, Data Centre World London / Paris, World Utilities Congress)
#   keep their note as a `note` only.
# - Tier 3 ("only ..." notes): keep only the labels the note names. A note that speaks only about
#   exhibitors narrows the SELL side and keeps every buy label; a note that names buyers narrows both.
#   Measured on classified_all.csv: 366 of 9,657 in-ICP companies would leave (267 sell, 99 buy),
#   mostly ADIPEC (155) and Global Industrie (87).

icp_version: ClimaTech V2 tabs

label_sets:
  SELL_ALL: [Cooling systems & air conditioning, Heat pumps, District energy systems & heating,
             Building automation & energy management, Ventilation & indoor air quality, Data-centre cooling,
             "Pumps, valves & hydronics", Thermal storage, Energy recovery systems,
             Commercial & industrial refrigeration, Energy services]
  BUY_ALL: [Developers & giga-projects, Building owners & operators, Facilities management companies,
            MEP consultants & specifiers, MEP / HVAC contractors & installers, District energy & utilities,
            Data centres & telecoms, Large energy users, Social housing & public estate]
  # "heat exchangers, (waste-)heat recovery, industrial heat pumps/chillers, EMS" (ADIPEC, Global Industrie):
  # heat exchangers sit in District energy systems & heating and Energy recovery systems (Products_Services v2
  # r26 / r56); chillers in Cooling systems; EMS in Building automation & energy management.
  INDUSTRIAL_HEAT: [Energy recovery systems, District energy systems & heating, Heat pumps,
                    Cooling systems & air conditioning, Building automation & energy management]

tiers:
  1: {keep: all}
  2: {keep: all}
  3: {keep: listed}

# Competitor v2 col E ("Best fit for") -> editions. "All - exhibitor sourcing" = all five editions.
# post_filter.yaml `editions` decides a BUYER's edition by country; a SELLER goes to these editions.
