  - Président                    # r56 Contains (r17 lists it Exact too; contains is the wider net)
  - Directeur Général
  - Directeur General            # unaccented spelling, as people type it on LinkedIn
  - Directrice Générale
  - Directrice Generale
  - Country Manager
  - Marketing
  - Communication
  - Communications               # whole-word matching: the singular doesn't hit the plural
