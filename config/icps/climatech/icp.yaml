# APPROVED by the user, 9 Nov 2026 ("yes"). Source: ClimaTech Playbook ICP.xlsx V2 tabs, each read in full.
# ClimaTech ICP: competitor-event companies -> people, for the five ClimaTech editions (Climatech KSA,
# ClimaTech London, ClimaTech Paris, ClimaTech Italy, HVACTech Live Vietnam).
# Read by .claude/skills/event-icp-clay-workflow/scripts/icp_mapping.py (the people workflow's ICP Mapping
# node). Source: scrapers_climatech/"ClimaTech Playbook ICP.xlsx", V2 tabs only, each read in full
# (user, 9 Nov 2026: "use V2 tabs ... always read the whole tab"): Products_Services v2 (85 rows),
# Seller JTs v2 (148), BuySide ICP v2 (72), Geo_Scope v2 (65), Brief v2, Competitor v2. Rules the Clay
# search can't express (exact match, per-keyword exclusions, personas, geo tier, the Germany split)
# are in post_filter.yaml beside this file; per-event rules in scope.yaml.
#
# Category keys are the classifier's labels character for character (scrapers_climatech/_run_v2/
# classify/classifier_prompt.txt; companies already classified -> _run_v2/classified_all.csv).
#
# Decisions (user, 9 Nov 2026: person location as proposed; Germany "LinkedIn only, no phone"):
# - Person location. The countries below filter where the PERSON is, as on Mining / Solar.
# - Germany: searched on the sell side (Geo_Scope v2 "Exhibitor sourcing"), LinkedIn only, never
#   emailed (Geo_Scope v2, Brief v2; post_filter.yaml linkedin_only_countries).
# - Sell side: Bookers and Stand staff in ONE contains search (the lists share most keywords, so two
#   searches would pay twice); post_filter.yaml tags the persona (Booker wins on overlap), as Solar.
# - Exact titles that are safe in contains mode (CEO, MD, GM, BDM, PDG ...) are in `titles` and judged
#   exactly by post_filter.yaml. Exact titles that contains mode would flood (bare Director, Manager,
#   Engineer, Owner, Partner, President, Vice President, Consultant) are in `exact_titles`, searched
#   only by a separate exact-mode pass if it's approved after the draft test.
# - "Run these lists only against companies that pass Products_Services v2" (Seller JTs v2 r148):
#   every sell company in the feed has a Products_Services v2 label, so this holds by construction.
#
# Seniority, every V2 tab: "All except Intern/Trainee, Assistant, Entry, Freelance"
# -> every Clay slug except entry and intern, plus the title exclusions below.
# Short brand for the final Salesforce CSV names (Competitive_<Brand>.csv; user, 2026-11-07; sf_naming.py).
salesforce_brand: ClimaTech
seniority:
- founder
- owner
- board-member
- partner
- c-suite
- vp
- director
- head
- manager
- senior
- mid-level
# Same split as Mining / Solar (A, B1, B2): a company returning exactly 10 is searched once per group.
seniority_groups:
  A:
  - founder
  - owner
  - board-member
  - partner
  - c-suite
  - vp
  - director
  B1:
  - head
  - manager
  B2:
  - senior
  - mid-level

# Both sides (the seniority note on every V2 tab). collect.py also applies this list at export.
exclude_titles:
- Intern
- Trainee
- Assistant
- Freelance
- Freelancer                     # whole-word matching misses "Freelancer" (Solar, 28 Oct 2026)

sell:
