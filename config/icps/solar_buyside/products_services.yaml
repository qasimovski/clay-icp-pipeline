# ANDed onto a category's description when its keywords alone are shared with non-solar work
# ("EPC contractor", "project development", "roofing").
anchors:
  solar:
    - solar
    - PV
    - photovoltaic
    - photovoltaics
    - BESS
    - battery storage
    - energy storage
    - renewable energy
    - renewables
  renewables:
    - solar
    - PV
    - photovoltaic
    - wind
    - renewable
    - renewables
    - renewable energy
    - clean energy
    - green energy
    - energy storage
    - energy transition
  # Electricity-specific on purpose. The first draft also had "energy", "power" and "utility":
  # the sample (2026-11-05) then let in water utilities (Rand Water, NWC) and gas transport (Snam).
  # Utilities & gencos only: the generic power anchor let oil-and-gas suppliers in (full run
  # 2026-11-05), so gencos must describe generating or supplying electricity.
  generation:
    - power generation
    - electricity generation
    - power plant
    - power plants
    - power station
    - power stations
    - electric utility
    - electricity company
    - electricity supply
    - generation capacity
  power:
    - electricity
    - electric
    - power generation
    - power plant
    - power plants
    - power station
    - power stations
    - generation capacity
    - megawatts
    - grid

