# DRAFT 2026-11-05, awaiting the user's approval. Nothing has been searched with it yet.
#
# Solar & Storage Live: BUY SIDE company searches. Every company these searches find is net-new
# to Solar Competitive Events and Solar Other Sources (they are deduped locally after the search;
# see "Dedupe" below).
#
# Source: the "BuySide ICP v2" tab of Solar___Storage_Live_ICP_-_Tiered.xlsx (Downloads, 26 Oct
# 2026; text copy in scrapers_solar/_run_v2/icp_tabs/BuySide_ICP_v2.txt). Only V2 is used; V2
# always wins (memory: icp-version-precedence).
#
# Decisions (user, 2026-11-05):
#   - Route: Clay's native company search, driven from the CLI (`clay searches query-mode`).
#     Clay Workflows has no company-search action (checked against the 811-action catalog,
#     2026-11-05); this CLI is the same query language as Find companies -> Query mode, without
#     the UI.
#   - The output is ONE CSV for all searches. The user imports it into Clay: one workbook per
#     BUYER GROUP (8), in a "Buy Side ICP" folder the user creates afterwards.
#   - All 8 buyer groups are in scope, including 7 Public sector and 8 Investors & financiers,
#     even though the sheet marks group 8 "conference programme, not mass build".
#   - Company location = ANY office in a buy country, not headquarters only (same as the Highways
#     and EVCharge buy sides).
#   - Volume is controlled by precision, not caps: the sheet's sub-segments, company keywords,
#     example organisations, title keywords and notes are spread across Clay's filters (industry,
#     NAICS, description, products_and_services, a solar anchor, and people.exists on the buyer
#     persona). There is no row cap and no size floor.
#
# One entry per sub-segment (26). `group` is the buyer group = the workbook it lands in.
# `priority` is the sheet's "Priority (proposed)" column; tier is A for groups 1-4, B for 5-7,
# C for 8 (sheet note).
#
# Where the sheet's industry names are old LinkedIn labels, they are mapped to Clay's enum:
#   Electrical/Electronic Manufacturing -> Appliances, Electrical, and Electronics Manufacturing
#   Oil & Energy -> Oil and Gas (+ the power anchor, so oil-only companies are left out)
#   Chemicals / Textiles / Plastics -> the matching "... Manufacturing" values
#   Logistics & Supply Chain -> Transportation, Logistics, Supply Chain and Storage
#   IT Services -> IT Services and IT Consulting;  Data Infrastructure -> Data Infrastructure and Analytics
#   Mining & Metals -> Mining, Metal Ore Mining, Coal Mining, Nonmetallic Mineral Mining, Primary Metal Manufacturing
#   Hospital & Health Care -> Hospitals and Health Care, Hospitals;  Agriculture -> Farming, Ranching, Forestry
#   Manufacturing (all) -> NAICS 31-33 (all of manufacturing), OR'd with the named industries
# Sheet-mapped values that already exist in Clay (Renewables & Environment, Renewable Energy
# Semiconductor Manufacturing, Construction...) are kept as written. Solar-specific Clay values the
# sheet doesn't name (Solar Electric Power Generation, Renewable Energy Power Generation, Services
# for Renewable Energy) are added where installers and developers actually list themselves.
#
# people.exists (groups 4, 5, 7): for the sectors where the industry alone is millions of
# companies (every factory, shop, hotel and council in 58 countries), the company must employ the
# buyer persona today (Energy / Sustainability / Estates ...), and that person must be in a buy
# country. A company without one would yield no people at the people step anyway. The titles come
# from the sheet's "Segment title keywords" column, specific terms only: Procurement, Engineering
# and Owner are dropped from the company filter because every company has them (sheet note:
# "Generic words ... are not used on their own"). The full persona is applied later, at the people
# search.
#
# Dedupe (user, 2026-11-05): after the search, drop every domain already in Solar Competitive Events
# (scrapers_solar/_run_v2/final/feed_all.csv) or Solar Other Sources
# (scrapers_solar/_other_sources/companies - final.csv), then mark the rest with the Supabase gate.
# Clay's exclude function takes at most 1,000 ids, so the dedupe is done locally, not in the query.

