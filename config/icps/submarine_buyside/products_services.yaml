# DRAFT 2026-11-19. Submarine Networks BUY SIDE company searches, from the "BuySide ICP v2" tab.
#
# Source: scrapers_submarine/Submarine Networks Playbook ICP (includes SubSea).xlsx, tab "BuySide ICP v2"
# (6 buyer groups, 11 sub-segments, cross-cutting titles, "Government by geo") and tab "Geo_Scope v2"
# (the two BUY columns). V2 always wins (memory: icp-version-precedence).
#
# Route (user, 2026-11-19, "ClimaTech route"): Clay company search from the CLI (clay_company_search.py,
# this file via ps_query_config.py) AND Blitz company search for every sub-segment -> union, dedupe by
# domain -> drop companies already in Submarine CE + Other Sources -> Supabase gate (known kept, flagged)
# -> Clay Find People -> Blitz where Clay finds nobody -> free Deepline where a country is thin. Cap 20
# people per company. Run folder scrapers_submarine/_buyside/, decisions in its DECISIONS.md.
#
# Decisions (user, 2026-11-19):
#   - Countries = the union of both Geo_Scope v2 buy columns, all tiers (Core / Yes / Secondary), the same
#     list as Submarine Other Sources. Germany = LinkedIn + phone only (split at email time). Sanctioned
#     countries are never built (none of them is in the list).
#   - Dedupe companies (domain) AND people (LinkedIn) against Submarine CE (_run_v2) and Other Sources
#     (_run_v2/other_sources).
#   - Group 5 "Marine and seabed users" included as written: seabed managers, offshore wind developers,
#     interconnector / TSO owners and port authorities (their marine-consents / licensing / route people).
#
# Company country enum differs from the people enum: Czech Republic -> Czechia, Côte d'Ivoire -> Ivory
# Coast, Brunei Darussalam -> Brunei, Timor-Leste -> East Timor. Solomon Islands and Palau are not Clay
# company countries, so they are searched on the people side only (person_countries).
#
# Precision, not caps (Solar rule): the sheet's industries + "Extra keyword filter (company)" carry each
# search; anchors / description_not / company_size are added where a sheet keyword alone floods (each one
# marked with its reason). The persona (people_titles) is used only where the company universe is a
# whole sector (hyperscalers = every software company that says "cloud"). Explicit "(1,000+ staff)" /
# "(10,000+ staff)" companions are written by hand, so persona_companion is off.

persona_companion: false

tiers: {}

anchors:
  # Marine users: an owner / developer / operator of seabed, wind farms, interconnectors or ports, not
  # the vessel and installation contractors (those are sell side).
  marine_owner:
    - developer
    - developers
    - develops
    - owner
    - owns
    - operator
    - operates
    - wind farm
    - wind farms
    - transmission system operator
    - TSO
    - grid operator
    - port
    - ports
    - harbour
    - harbor
    - seabed
    - Crown Estate
    - leasing

