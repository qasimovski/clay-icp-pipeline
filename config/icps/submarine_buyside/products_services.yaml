  # =====================================================================
  # 2. Hyperscalers & content providers
  # =====================================================================
  # "cloud" in Software Development / IT Services is every SaaS firm, so the base search needs the
  # buyer persona (a current employee titled like the sheet's network-acquisition / subsea teams, in a
  # buy country). The generic sheet titles (Network Infrastructure, Sourcing) are left to the people
  # search. A hand-written 10,000+ companion keeps the big platforms whose staff Clay has not typed.
  # Sample 2026-11-19: with "Global Network / Network Deployment / Hyperscale" in the persona, and a
  # 10,000+ companion, the list was IT-services firms (HCLTech, Cognizant, Capgemini). Persona now the
  # subsea-specific titles only; the companion is gone. Apple (electronics) and Netflix (entertainment)
  # industries added (ADDED) because the sheet names Apple and "content companies".
  - name: Global cloud and content companies
    group: 2. Hyperscalers & content providers
    priority: High
    notes: Sheet - Microsoft, Meta, Google, AWS, Apple, Oracle. Network acquisition teams buy; partnership/marketing teams out.
    industry:
