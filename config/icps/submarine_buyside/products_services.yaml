# Merge order = plan order: a company found by several searches is filed under the FIRST (the sheet's
# buyer-group order), so cable owners claim SEACOM before the carrier searches do.
# Exception (2026-11-19): group 4 (government) runs FIRST, because regulators (NCC, ITU) are typed
# Telecommunications and would otherwise be filed under a carrier search; its phrases are specific.
