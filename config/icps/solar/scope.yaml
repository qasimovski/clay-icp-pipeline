# Solar & Storage Live ICP: which scraped companies are in scope, and how the earlier run's typing
# maps onto V2. Read by .claude/skills/event-icp-clay-workflow/scripts/remap_prior.py.
# Source: "Solar___Storage_Live_ICP_-_Tiered.xlsx" V2 tabs (Competitor v2, Products_Services v2,
# BuySide ICP v2); decisions of 26 Oct 2026 (scrapers_solar/DECISIONS_V2.md). V2 ALWAYS WINS: the
# earlier run's KEEP/DROP is never read, only its per-company TYPE.
# `events:` below is generated by scrapers_solar/_run_v2/build/make_scope.py from the Competitor v2
# rows; edit the rules there and rerun, not here.

icp_version: Solar & Storage Live V2 tabs

# The earlier run (Hamza Nasir / Lilly Roessen, Feb-Jul 2026), pulled read-only from Clay
# (_run_v2/prior). Its competitive-event tables typed SIDE only (Seller / Buyer), never a product
# category, so those are unknowns here. Its Products & Services lists carry real V1 categories,
# mapped below. User, 26 Oct 2026: "use the three CSVs; if side and classification are missing,
# check the Clay tables".
type_map:
  PS_INSTALLERS: [Buy Side, Installers & EPCs]
  PS_UTILITIES_IPPS: [Buy Side, Utilities & energy retailers]      # IPPs -> Developers & IPPs on re-check
  PS_GOVERNMENT: [Buy Side, Public sector]
  PS_SOLAR_DEVELOPERS: [Buy Side, Developers & IPPs]
  PS_LANDOWNERS: [Buy Side, Landowners & agriculture]
  # V1 sell category moved to the buy side by V2 ("Moved to BuySide v2 (1. Installers & EPCs;
  # 2. Developers & IPPs)"). Re-checked: developers relabel to Developers & IPPs.
  PS_EPC_DEVELOPERS_ENGINEERING: [Buy Side, Installers & EPCs]
  PS_BATTERY_COMPONENTS: [Sell Side, Energy storage & batteries]   # "Battery Component Manufacturers merged in"
  PS_CLEAN_GENERATION: [Sell Side, Off-grid & hybrid systems]      # "Clean Generation merged in"
  PS_OM: [Sell Side, "O&M, testing & recycling"]
  PS_DIGITAL_SMART_TECH: [Sell Side, "Monitoring, EMS & software"]   # "Merges 4 Digital & Smart Tech rows"
  PS_DISTRIBUTORS_RESELLERS: [Sell Side, Distributors & wholesalers]
  PS_CERTIFICATION: [Sell Side, "Grid connection, certification & training"]
  PS_TRAINING_RECRUITMENT: [Sell Side, "Grid connection, certification & training"]  # recruitment: re-check

# V1 types with no V2 home.
drop_types:
  PS_SOLAR_THERMAL: "V2 removed Solar Thermal Technologies (heating market; not PV or storage)"

# Not typed in V2 terms. SELLER / BUYER (the earlier run's side) go to typing like any unknown,
# with the old side passed along as a hint, never as the answer.
unknown_types: ["", UNKNOWN, SELLER, BUYER]

# Labels only the typing step produces (no earlier-run type maps to them).
extra_labels: [PV cells & modules, Inverters & power electronics, "Mounting, tracking & racking",
               PV balance of system & electrical, BESS fire safety, Large energy users (C&I),
               Property & facilities, Investors & financiers]

label_sets:
  SELL_ALL: [PV cells & modules, Inverters & power electronics, Energy storage & batteries,
             "Mounting, tracking & racking", Distributors & wholesalers, PV balance of system & electrical,
             "Monitoring, EMS & software", "O&M, testing & recycling", Off-grid & hybrid systems,
             BESS fire safety, "Grid connection, certification & training"]
  # "Stationary storage / BESS suppliers": storage kit, the PCS that runs it, and its fire safety.
  STORAGE: [Energy storage & batteries, Inverters & power electronics, BESS fire safety]
  BUY_ALL: [Installers & EPCs, Developers & IPPs, Utilities & energy retailers, Large energy users (C&I),
            Property & facilities, Landowners & agriculture, Public sector, Investors & financiers]

# Competitor v2 col C (Tier). Every tier keeps every V2 label unless the event's note narrows it
# (`keep`), and every tier sends unknowns to typing: almost every competitor company is an unknown
# here (the earlier run typed side only), so "unsure -> drop" applies to the typing's verdict, not
# before it. Products_Services v2 / BuySide ICP v2 labels already exclude what isn't ICP.
tiers:
  1: {keep: all, unknown: classify}
  2: {keep: all, unknown: classify}
  3: {keep: all, unknown: classify}

# Re-check / typing (recheck.py), against V2's tabs word for word.
recheck:
  labels:
    Utilities & energy retailers: "V1 'Utilities ... & IPPs': IPPs and asset owners are Developers & IPPs in V2"
    Installers & EPCs: "V1 EPC list mixed EPCs, developers and engineering services; electrical/roofing contractors need solar in the description"
    Off-grid & hybrid systems: "V1 Clean Generation: V2 keeps gensets only when sold as solar hybrids"
    "Grid connection, certification & training": "V1 Training & Recruitment: V2 removed recruitment agencies"
  out_codes: [OIL_GAS, HYDROGEN, HEAT_PUMP_HVAC_THERMAL, UPSTREAM_MATERIALS, EV_BATTERY_EQUIPMENT, LEGAL,
              GENERIC_CONSULTING, CSP, RECRUITMENT, GERMANY_ONLY, NOT_EXPORTER, NOT_A_COMPANY,
              NO_SOLAR_STORAGE_LINK]
  # Geo Scope v2: "drop German companies with no presence outside Germany" -> OUT code GERMANY_ONLY.
  # Products_Services v2: "never drop a proven paying client - check Salesforce SPEX history before
  # excluding": the Supabase gate's "targeted before" flag is shown beside every OUT verdict.

