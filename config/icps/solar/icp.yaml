# APPROVED by the user, 26 Oct 2026 ("yes, approved"). Competitor v2 per-event COUNTRIES column ignored: Geo Scope v2 wins (user, 26 Oct 2026).
# Solar & Storage Live ICP: competitor-event companies -> people, for every SSL edition.
# Read by .claude/skills/event-icp-clay-workflow/scripts/icp_mapping.py (the people workflow's
# ICP Mapping node). Source: "Solar___Storage_Live_ICP_-_Tiered.xlsx" (Downloads, 26 Oct 2026),
# V2 tabs only (V2 always beats V1): Products_Services v2, Seller JTs v2, BuySide ICP v2,
# Geo Scope v2, Brief v2. Rules the Clay search can't express (exact match, per-keyword exclusions,
# personas, geo tier, the Germany split) are in post_filter.yaml beside this file.
#
# Decisions behind this file (user, 26 Oct 2026, "go with your recommendations"):
# - Person location only. The countries below filter where the PERSON is, not the company HQ.
# - Germany: searched, LinkedIn URL only. No phone and no email are ever looked up
#   (post_filter.yaml linkedin_only_countries; Brief v2 beats Geo Scope v2's "Email + LinkedIn").
# - Sudan, Libya, Iraq, Lebanon and Myanmar are removed everywhere (Brief v2, 23 Oct 2026), even
#   though Geo Scope v2 (15 Oct) still lists them.
# - Sell side: Bookers and Stand staff in ONE contains search (the lists share keywords, so two
#   searches would pay twice); post_filter.yaml tags the persona (Booker wins on overlap).
# - Exact titles that are safe in contains mode (CEO, MD, CMO...) are in `titles` and judged exactly
#   by post_filter.yaml. Exact titles that contains mode would flood (VP, bare Director / Owner /
#   President on the buy side) are in `exact_titles`, searched only by a separate exact-mode pass if
#   it's approved after the draft test.
# - "Run these lists only against companies that pass Products_Services v2" (Seller JTs v2): every
#   sell company in the feed has a Products_Services v2 label, so this holds by construction.
#
# Seniority, every V2 tab: "All except Intern/Trainee, Assistant, Entry, Freelance"
# -> every Clay slug except entry and intern, plus the title exclusions below.
# Short brand for the final Salesforce CSV names (Competitive_<Brand>.csv, Buy_side_<Brand>.csv ...;
# user, 2026-11-07; .claude/skills/event-icp-clay-workflow/scripts/sf_naming.py). Letters and digits only.
