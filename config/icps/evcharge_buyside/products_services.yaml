# EVCharge Live — BUY SIDE company searches
#
# Source: the `BuySide ICP` sheet of the EVCharge ICP workbook. Rendered by the
# same automation/cleanup/ps_query_config.py as the seller side — it lives under
# its own ICP directory (`evcharge_buyside`) purely so `--icp evcharge_buyside`
# selects it without any code change.
#
# BUY SIDE, not sell side. These are the organisations that OWN or OPERATE
# fleets, depots, networks and estates — the people who *buy* charging
# infrastructure. The seller-side file (config/icps/evcharge/) is the mirror
# image: vendors selling into them. Do not merge the two.
#
# What the sheet contributes per Top level:
#   Industries column -> `industry` (the sheet's "sub level")
#   Countries (sheet row 2, one list for every entry) -> `countries`
# Job Titles / MATCH TYPE / SENIORITY are for the People table only and are
# deliberately absent here (user, 2026-08-09).
#
# Sheet countries normalised to Clay's `country_name` enum:
#   "Saudi" -> Saudi Arabia, "UK" -> United Kingdom, "UAE" -> United Arab Emirates.
countries:
  - Australia
  - Indonesia
  - Qatar
  - South Africa
  - Saudi Arabia
  - Thailand
  - United Kingdom
  - United Arab Emirates
  - United States

# The relevance gate. Every category here is a broad operator industry —
# "Truck Transportation" alone is every haulier on earth — so an EV/charging
# anchor is what makes the list an EVCharge audience rather than a transport
# directory. Buy-side wording differs from the seller side: these organisations
# describe themselves as electrifying a fleet, hitting net zero or running
# depots, not as selling chargers.
ev_anchor:
  - EV
  - EVs
  - electric vehicle
  - electric vehicles
  - EV fleet
  - electric fleet
  - fleet electrification
  - electrification
  - electrify
  - electric bus
  - electric buses
  - electric truck
  - electric trucks
  - EV charging
  - charging infrastructure
  - charge point
  - charging points
  - depot charging
  - e-mobility
  - zero emission
  - zero-emission
  - decarbonisation
  - decarbonization
  - net zero
  - sustainable transport
  - green fleet
  - alternative fuels

# Unused on the buy side today; ps_query_config requires the key to exist and
# validates any category that selects it with `ev_anchor: adjacent`.
adjacent_anchor:
  - EV
  - electric vehicle
  - electric vehicles
  - EV charging
  - charging infrastructure
  - electrification
  - net zero
  - decarbonisation
  - sustainability

