  # Sheet row 2: "All Industries (exclude Aviation/Aerospace)" — the catch-all
  # for EV-charging buyers whose industry is not one of the six above. Built
  # LAST and deliberately shaped differently:
  #
  #   * NO positive industry list. That is the point of the row, so the country
  #     and description clauses carry the entire filter.
  #   * Because nothing gates the industry, the keywords must be far stricter
  #     than the other categories. Weak signals are removed on purpose: bare
  #     "EV", "electrification", "net zero", "sustainability" and
  #     "decarbonisation" appear in the boilerplate of virtually every large
  #     company and would return a directory, not an audience. Every phrase
  #     below names charging or a fleet transition explicitly — the buying
  #     intent the Brief describes ("if you are building, funding, operating or
  #     supplying EV charging infrastructure").
  #   * The sheet's carve-out is applied as `industry_not`, covering all seven
  #     aviation/aerospace/space enum values rather than just the obvious one.
  - name: All Industries (exclude Aviation & Aerospace)
    ev_anchor: false
    # Two groups of exclusion, both necessary once the industry gate is gone.
    #
    # 1. The sheet's own carve-out: aviation / aerospace / space.
    # 2. The SELL side and the bystanders. Verified against a live preview,
    #    which returned Sungrow, Growatt, GoodWe, CHINT, SolarEdge, Delta,
    #    Enphase, ChargePoint and Enel X — every one a vendor already covered by
    #    the seller-side Products & Services folder — plus Taylor Hopkinson and
    #    Brightsmith, recruiters who write about EV charging because they staff
    #    it. On a buy-side list these are wrong answers, and without an industry
    #    gate nothing else keeps them out.
    #
    # Deliberately NOT excluded: Utilities, Oil and Gas, Electric Power
    # Generation and Real Estate. Those are genuine buyers here (bp, ScottishPower,
    # Dubai Electricity & Water, Prologis) even though some also sell.
    industry_not:
      # the sheet's carve-out
      - Airlines and Aviation
      - Aviation & Aerospace
      - Aviation and Aerospace Component Manufacturing
      - Defense & Space
      - Defense and Space Manufacturing
      - Space Research and Technology
      - Flight Training
      # hardware and equipment vendors — the seller side
      - Renewable Energy Equipment Manufacturing
      - Renewable Energy Semiconductor Manufacturing
      - Electrical Equipment Manufacturing
      - Appliances, Electrical, and Electronics Manufacturing
      - Computers and Electronics Manufacturing
      - Industrial Machinery Manufacturing
      - Machinery Manufacturing
      - Automation Machinery Manufacturing
      - Motor Vehicle Manufacturing
      - Motor Vehicle Parts Manufacturing
      - Semiconductor Manufacturing
      - Semiconductors
      # software and services vendors — the seller side
      - Software Development
      - IT Services and IT Consulting
      # bystanders: write about EV charging, never buy it
      - Staffing and Recruiting
      - Executive Search Services
      - Human Resources Services
    description:
      - EV charging
      - EV chargers
      - electric vehicle charging
      - charging infrastructure
      - charging network
      - charging stations
      - charge points
      - charging points
      - depot charging
      - workplace charging
      - destination charging
      - rapid charging
      - EV infrastructure
