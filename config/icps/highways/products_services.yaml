# Highways — Products & Services company searches
#
# Source of truth: the `Products_Services` sheet of `ICP - Highways new.xlsx`
# (gitignored — see docs/SENSITIVE_DATA.md). One entry per **Top level** value;
# each becomes one Clay workbook named after the Top level, holding one table
# named `Companies`, inside `Highways [Qasim - 2026] -> Products & Services`,
# populated by Find companies -> Build with filters -> Query mode.
#
# The sheet has 23 real Top levels plus a `GH - bit of repetition` annotation
# row, which is not a category and is deliberately absent here.
#
# COUNTRIES ARE PER CATEGORY, unlike the EVCharge config's single ICP-wide list:
# the sheet sets COUNTRIES per Top level (6 for Certification and Training, 13
# for the construction categories, 10 for the digital ones). ps_query_config
# takes a category's own `countries` in preference to any ICP-level list.
#
# Two spellings are corrected on the way in, per the user: the sheet writes
# "UK" (-> United Kingdom, the Clay enum value) and "Saudia Arabia" (-> Saudi
# Arabia). Both are silently dropped by Clay if left as written, which just
# narrows the result set with no error.
#
# Rendered by automation/cleanup/ps_query_config.py as:
#
#   select from companies
#   where locations.any(country_name in (<countries>))
#     and industry in (<industry>)
#     and (description contains (<description>)
#          or products_and_services is_similar_to (<products_and_services>))
#
# SELLER SIDE. Products_Services is the seller half of the ICP, so every
# category must describe a company that *makes, sells, supplies or delivers*
# into roads and highways — never a company that merely builds or operates
# roads. For Highways the buy side is the contractors, local authorities and
# national road agencies, so the industry lists here deliberately exclude
# Construction, Civil Engineering, Highway/Street/Bridge Construction and
# Specialty Trade Contractors on the service categories. See the note on
# Certification and Training for what that costs.
#
# Rules from docs/CLAY_QUERY_SKILL.md that constrain what may be edited here:
#   - `industry` is a closed enum: every value must match the field list exactly.
#   - `products_and_services` is capped at **3 values per query**.
#   - description/products for the SAME concept are OR'd (never AND'd), for recall.
#   - `contains` is whole-word token matching, case-insensitive. Values whose
#     tokens do not survive tokenisation are omitted on purpose — the sheet's
#     "Traffic management training (T1–T7)" is carried as the phrase, never the
#     en-dashed range, and bare ambiguous acronyms are spelled out.

# ANDed onto categories whose industry mapping is horizontal — every training
# provider, every consultancy, every software house — and which would otherwise
# return the whole sector rather than its roads-and-highways slice. Same device
# as the EVCharge config's ev_anchor, selected per category with `anchor: roads`.
#
# Measured on Certification and Training (2026-08-14): without it the category
# previews 6,388 companies across 6 countries, which is every first-aid and
# manual-handling trainer in those markets, not the highways training market.
anchors:
  roads:
    - highway
    - highways
    - road
    - roads
    - street works
    - streetworks
    - traffic management
    - roadworks
    - road works
    - civil engineering
    - construction
    - infrastructure

categories:

  # ---------------------------------------------------------------------
  # Sheet row 1. 12 sub levels, all UK-qualification shaped (LANTRA, CSCS,
  # NRSWA, CPCS/NPORS, SSSTS/SMSTS, CDM) plus generic workplace safety
  # courses (HSE, first aid, manual handling).
  #
  # ADDED BEYOND THE SHEET (the user asked for related sub levels to be
  # inferred): the awarding/levy bodies and the qualifications that sit
  # alongside the listed ones in every UK highways training prospectus —
  # CITB, NEBOSH, IOSH, NVQ — and the operative-level courses the sheet
  # implies but does not name: temporary traffic management, Chapter 8
  # signing, streetworks operative/supervisor, working at height, confined
  # space, abrasive wheels, slinger/signaller, banksman/traffic marshal,
  # plant operator training and road safety training.
  #
  # WHY THE INDUSTRY LIST EXCLUDES CONSTRUCTION AND CIVIL ENGINEERING:
  # this category's description keywords include genuinely generic phrases
  # ("health and safety training", "first aid", "manual handling") that
  # appear in the profile of almost every contractor. Admitting the
  # construction enums would AND-match those and flood the table with
  # contractors — i.e. the buy side — which is exactly the seller-side trap
  # documented for the EVCharge build. The cost is real and accepted: a
  # contractor that genuinely sells NRSWA training as a side business is
  # missed. Awarding bodies and associations ARE included, because LANTRA,
  # CITB and NPORS themselves classify that way.
  - name: Certification and Training
    anchor: roads
    countries:
      - Australia
      - Indonesia
      - New Zealand
      - Saudi Arabia          # sheet reads "Saudia Arabia"
      - United Kingdom        # sheet reads "UK"
      - United Arab Emirates
    industry:
      - Professional Training and Coaching
      - Technical and Vocational Training
      - E-Learning Providers
      - E-Learning
      - Education Management
      - Education Administration Programs
      - Higher Education
      - Public Safety
      - Business Consulting and Services
      - Professional Services
      - Human Resources Services
      - Industry Associations
      - Professional Organizations
      - Non-profit Organizations
    description:
      # -- named in the sheet
      - LANTRA
      - CSCS
      - NRSWA
      - street works
      - streetworks
      - highway safety
      - highways safety
      - traffic management training
      - CPCS
      - NPORS
      - plant training
      - health and safety training
      - HSE training
      - first aid at work
      - first aid training
      - manual handling
      - SSSTS
      - site supervisor training
      - SMSTS
      - site manager training
      - CDM regulations
      # -- inferred: awarding, levy and qualification bodies
      - CITB
      - NEBOSH
      - IOSH
      - NVQ
      - construction skills training
      - construction training
      - vocational training
      - accredited training provider
      # -- inferred: the operative-level courses that sit alongside the above
      - temporary traffic management
      - traffic marshal
      - banksman
      - slinger signaller
      - working at height
      - confined space training
      - abrasive wheels
      - plant operator training
      - road safety training
      - highway maintenance training
    products_and_services:
      - construction health and safety training
      - street works and traffic management training
      - plant operator certification and accreditation

