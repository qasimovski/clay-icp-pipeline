# EVCharge Live — Products & Services company searches
#
# Source of truth: the `Products_Services` sheet of the EVCharge ICP workbook.
# One entry per **Top level** value; each becomes one Clay workbook + one table
# of the same name inside `10. EVCharge [2026 - Qasim] -> Products & Services`,
# populated by Find companies -> Build with filters -> Query mode.
#
# The sheet's 16th Top level (Real Estate & Destination Infrastructure) is
# annotated "GH remove" on every sub level and is deliberately absent here.
# `Installation, Construction & Maintenance Service` keeps the sheet's singular
# "Service" — these strings become live Clay workbook/table names.
#
# Rendered into a query by automation/cleanup/ps_query_config.py as:
#
#   select from companies
#   where locations.any(country_name in (<countries>))
#     and industry in (<industry>)
#     and (description contains (<description>)
#          or products_and_services is_similar_to (<products_and_services>))
#     and description contains (<ev_anchor>)      # only when ev_anchor: true
#
# SELLER SIDE. Products_Services is the seller half of the ICP (the Side column
# in the Labs build), so every category here must describe a company that
# *makes, sells or supplies* into EV charging — never one that merely operates a
# fleet, runs a transit network or buys chargers. The keyword lists are written
# as offerings, which is seller-shaped by construction; the trap is the
# `industry` list, where operator enums (Truck Transportation, Ground Passenger
# Transportation, Urban Transit Services, Government Administration, Equipment
# Rental Services) pull in pure buyers. They are deliberately absent below —
# do not add them back without moving the category to the buy side.
#
# Rules from docs/CLAY_QUERY_SKILL.md that constrain what may be edited here:
#   - `industry` is a closed enum: every value must match the field list exactly.
#   - `products_and_services` is capped at **3 values per query**, workspace-wide
#     rule, not a style preference. Concepts beyond 3 belong in `description`.
#   - description/products for the SAME concept are OR'd (never AND'd) for recall.
#   - `contains` is whole-word token matching, case-insensitive. Bare ambiguous
#     acronyms are omitted on purpose: CCS (also carbon capture & storage), ITS,
#     MaaS, GB/T (the slash does not tokenise). The spelled-out phrase is used.
#   - No `limit` clause: result caps belong in the search panel, and per the user
#     (2026-08-07) no cap is applied on this first pass.

countries:
  - Australia
  - China
  - Canada
  - France
  - India
  - Israel
  - Italy
  - Japan
  - Malaysia
  - Netherlands
  - New Zealand
  - Portugal          # sheet reads "Portugla"
  - Saudi Arabia      # sheet reads "Saudi"
  - South Korea
  - Singapore
  - Spain
  - Sweden
  - Taiwan
  - Thailand
  - United Kingdom    # sheet reads "UK"
  - United Arab Emirates   # sheet reads "UAE"
  - United States

# ANDed onto the categories whose industry mapping is horizontal (every VC, every
# electrical contractor, every consultancy) and would otherwise drown the list.
# Per the user (2026-08-07). `ev_anchor: true` on a category selects this list.
ev_anchor:
  - EV
  - electric vehicle
  - electric vehicles
  - EV charging
  - charging infrastructure
  - e-mobility
  - electrification

# `ev_anchor: adjacent` selects this wider list instead.
#
# The strict EV anchor starved three categories (Traffic 85, Civil Engineering
# 220, Asset Management 220 rows). Those sellers are real EVCharge exhibitors —
# an ANPR vendor serving kerbside charging bays, a BIM platform used to design
# charging hubs, a condition-monitoring provider watching charger uptime — but
# they describe themselves in the language of kerbside, parking, decarbonisation
# and net zero, not "EV". Dropping the anchor entirely is the wrong fix: it
# would readmit every construction and traffic firm on earth. Widening it keeps
# a relevance gate while matching how these companies actually write.
adjacent_anchor:
  - EV
  - electric vehicle
  - electric vehicles
  - EV charging
  - charging infrastructure
  - charging station
  - charging stations
  - charge point
  - charge points
  - e-mobility
  - electrification
  - electric fleet
  - kerbside
  - curbside
  - decarbonisation
  - decarbonization
  - energy transition
  - net zero
  - zero emission

