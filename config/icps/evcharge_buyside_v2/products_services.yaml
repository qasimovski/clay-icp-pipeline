# DRAFT 2026-11-06. EVCharge BUY SIDE company searches, from the "BuySide ICP v2" tab.
#
# Source: scrapers_evcharge/EV Charge Playbook ICP v3.xlsx, tab "BuySide ICP v2" (10 buyer groups,
# 35 sub-segments) and tab "Geo_Scope v2" (BUY columns). No "BuySide ICP v3" tab exists; the user
# said to use V3 if present, else V2 (2026-11-06). V2 always wins (memory: icp-version-precedence).
#
# The August 2026 build in config/icps/evcharge_buyside/ is the OLD BuySide ICP (v1) and is left
# untouched: its live state files (automation/cleanup/*evcharge_buyside*.json) still point at it.
#
# Route (user, 2026-11-06: "do the same as Solar's buy side"): Clay company search from the CLI
# (`clay searches query-mode`, automation/cleanup/clay_company_search.py) -> ONE company CSV
# (merge_company_search.py) -> Find People in Clay -> Blitz for the companies Clay finds nobody at.
#
# Decisions (user, 2026-11-06):
#   - Geo: the user first said geo is for the people, not the companies, then answered the
#     clarifying question "You can use country filters". So, as for Solar: a company qualifies
#     with ANY office in a buy country, and the broad sectors also require a current employee
#     with the buyer persona who is located in a buy country (people.exists below).
#   - Buy countries = every Geo_Scope v2 BUY value that is not Parked (Core / Yes / Secondary,
#     incl. Ukraine and Moldova marked "Confirm") PLUS the Philippines. Middle East, Africa, the
#     rest of South-East Asia, New Zealand and Australia stay parked.
#   - Dedupe: drop companies already in EVCharge Competitive Events and EVCharge Other Sources
#     (Solar precedent). The August V1 buy-side companies are NOT dropped (V2 re-decides them);
#     people already delivered in August are dropped at the people step.
#   - Enrich Company is skipped: the search returns firmographics, joined onto people by domain.
#
# Precision, not caps (Solar rule): the sheet's industries, "Extra keyword filter (company)",
# example organisations and notes are spread across industry / description / description_not /
# anchors, and the broad sectors carry the persona filter (people_titles). The persona list is the
# sheet's "Segment title keywords" with the generic words left out (Operations, Engineering,
# Procurement, Development, Owner, Director: every company has them; sheet notes treat generic
# words the same way); the cross-cutting EV titles are added. The full persona is applied at the
# people search, not here.
#
# persona_companion: Solar's persona filter dropped big real targets whose staff Clay has not
# typed (2026-11-06, user chose "persona + add back 1,000+ staff"). Here every category with
# people_titles automatically gets a companion "<name> (1,000+ staff)": the same query without
# the persona, sizes 1,001+. The merge files it under the same sub-segment ("Found By" says which).
#
# Industry names the sheet uses that are not Clay enum values were mapped:
#   Shopping Centres & Malls -> Retail / Leasing Non-residential Real Estate + mall keywords
#   Fuel Distributors -> Wholesale Petroleum and Petroleum Products
#   Retail Building Materials -> Retail Building Materials and Garden Equipment
#   Airlines and Aviation (airports only) -> Airlines and Aviation + airport keywords
#   Courier / Retail (delivery arms) -> Freight and Package Transportation + parcel keywords
#   Public Transport (Government) -> Urban Transit Services (+ a transit-agency search on
#     Government Administration)
#   Truck/Van manufacturing -> Motor Vehicle Manufacturing
#   Technology (ride-hail) -> Technology, Information and Internet + ride-hail keywords
#   Construction (plant) -> Construction
#   Investment Management (real estate) -> Investment Management + real-estate keywords

