# DRAFT 2026-11-06. EVCharge BUY SIDE people search (Find People), from the "BuySide ICP v2" tab of
# scrapers_evcharge/EV Charge Playbook ICP v3.xlsx (no v3 BuySide tab exists). GENERATED from the sheet
# by a one-off script; the categories are the 35 sub-segments of products_services.yaml beside this file
# (the company search), so Classification = Sub-segment in the people feed.
#
# Read by .claude/skills/event-icp-clay-workflow/scripts/icp_mapping.py (the ICP Mapping node of the
# people workflow) and post_filter.py (with post_filter.yaml beside this file).
#
# Per category: the sheet's "Segment title keywords (Contains)" + every CROSS-CUTTING title (EV-specific,
# Energy & sustainability, Property & estates, Senior decision-makers). The three cross-cutting titles the
# sheet marks Exact (CEO, COO, MD) are searched with contains and judged exactly by post_filter.yaml.
# Government sub-segments ("See Government by geo") get the union of the GOVERNMENT BY GEO title lists
# (UK, US, Canada, Latin America, Europe).
#
# Countries (user, 2026-11-06): Geo_Scope v2 BUY columns that are not Parked (Core / Yes / Secondary)
# plus the Philippines, in Clay's people spelling. Germany is searched but LinkedIn-only (post_filter.yaml).
# Seniority: "All except Intern/Trainee, Assistant, Entry, Freelance" (every tab row).
# EXCLUDE row: Intern; Student; Researcher; Research Fellow; Professor; Lecturer; PhD; Assistant; Trainee.
# Added: Product Owner (Owner is a contains keyword), and Business Development where the sheet's bare
# "Development" keyword means property / site development, and MD (= Doctor of Medicine) in Hospitals and
# Universities (pilot 2026-11-06: the sheet's exact "MD" matched physicians).
# `sell` is empty: this ICP config is buy side only (the sell side is config/icps/evcharge/).

# Short brand for the final Salesforce CSV names (Competitive_<Brand>.csv, Buy_side_<Brand>.csv ...;
# user, 2026-11-07; .claude/skills/event-icp-clay-workflow/scripts/sf_naming.py). Letters and digits only.
